<div class="auth-page">
  <button type="button" class="auth-theme btn btn--ghost btn--icon" (click)="toggleTheme()" aria-label="Toggle theme">
    {{ theme.resolved() === 'dark' ? '☀' : '☾' }}
  </button>

  <section class="auth-panel" aria-labelledby="login-heading">
    <header class="auth-panel__head">
      <div class="auth-panel__brand">
        <img class="auth-logo" src="/logo.png" width="36" height="36" alt="" />
        <p class="eyebrow">Pulse</p>
      </div>
      <h1 id="login-heading">Sign in to your tracker</h1>
      <p class="muted">Your activities, goals, and habits stay ready when you return.</p>
    </header>

    <form class="form-grid" (ngSubmit)="submit()" novalidate>
      @if (formError()) {
        <p class="auth-error" role="alert">{{ formError() }}</p>
      }

      <label class="field">
        <span>Email</span>
        <input
          class="input"
          type="email"
          name="email"
          autocomplete="email"
          [(ngModel)]="email"
          required
          [disabled]="submitting()"
        />
      </label>

      <label class="field">
        <span>Password</span>
        <input
          class="input"
          type="password"
          name="password"
          autocomplete="current-password"
          [(ngModel)]="password"
          required
          [disabled]="submitting()"
        />
      </label>

      <button type="submit" class="btn btn--primary btn--block auth-submit" [disabled]="submitting()">
        {{ submitting() ? 'Signing in…' : 'Sign in' }}
      </button>
    </form>

    <p class="auth-switch muted">
      New here?
      <a routerLink="/register">Create an account</a>
    </p>
  </section>
</div>
