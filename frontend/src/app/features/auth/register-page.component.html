<div class="auth-page">
  <button type="button" class="auth-theme btn btn--ghost btn--icon" (click)="toggleTheme()" aria-label="Toggle theme">
    {{ theme.resolved() === 'dark' ? '☀' : '☾' }}
  </button>

  <section class="auth-panel" aria-labelledby="register-heading">
    <header class="auth-panel__head">
      <div class="auth-panel__brand">
        <img class="auth-logo" src="/logo.png" width="36" height="36" alt="" />
        <p class="eyebrow">Pulse</p>
      </div>
      <h1 id="register-heading">Create your tracker</h1>
      <p class="muted">Your activities, goals, and habits stay saved to your account.</p>
    </header>

    <form class="form-grid" (ngSubmit)="submit()" novalidate>
      @if (formError()) {
        <p class="auth-error" role="alert">{{ formError() }}</p>
      }

      <label class="field">
        <span>Name</span>
        <input
          class="input"
          type="text"
          name="name"
          autocomplete="name"
          [(ngModel)]="name"
          required
          [disabled]="submitting()"
        />
      </label>

      <label class="field">
        <span>Email</span>
        <input
          class="input"
          type="email"
          name="email"
          autocomplete="email"
          [(ngModel)]="email"
          required
          [disabled]="submitting()"
        />
      </label>

      <div class="field-row">
        <label class="field">
          <span>Password</span>
          <input
            class="input"
            type="password"
            name="password"
            autocomplete="new-password"
            [(ngModel)]="password"
            required
            minlength="6"
            [disabled]="submitting()"
          />
        </label>
        <label class="field">
          <span>Confirm</span>
          <input
            class="input"
            type="password"
            name="confirmPassword"
            autocomplete="new-password"
            [(ngModel)]="confirmPassword"
            required
            [disabled]="submitting()"
          />
        </label>
      </div>

      <button type="submit" class="btn btn--primary btn--block auth-submit" [disabled]="submitting()">
        {{ submitting() ? 'Creating…' : 'Create account' }}
      </button>
    </form>

    <p class="auth-switch muted">
      Already have an account?
      <a routerLink="/login">Sign in</a>
    </p>
  </section>
</div>
